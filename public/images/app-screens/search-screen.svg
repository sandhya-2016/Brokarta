<svg width="430" height="700" viewBox="0 0 430 932" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#00cc9c" stop-opacity="0.08"/>
      <stop offset="70%" stop-color="#00cc9c" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="phoneBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a9a9e"/>
      <stop offset="18%" stop-color="#e4e4e7"/>
      <stop offset="35%" stop-color="#6f6f74"/>
      <stop offset="55%" stop-color="#8f8f94"/>
      <stop offset="75%" stop-color="#4a4a4e"/>
      <stop offset="100%" stop-color="#232326"/>
    </linearGradient>

    <linearGradient id="buttonMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#57575b"/>
      <stop offset="50%" stop-color="#c9c9cd"/>
      <stop offset="100%" stop-color="#3a3a3d"/>
    </linearGradient>

    <linearGradient id="glassSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="18%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="cameraLens" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#5a7ea8"/>
      <stop offset="45%" stop-color="#12181f"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <linearGradient id="headerBlur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="navBlur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.98"/>
    </linearGradient>

    <linearGradient id="cardImg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242c3d"/>
      <stop offset="100%" stop-color="#151a26"/>
    </linearGradient>
    <linearGradient id="cardImg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2635"/>
      <stop offset="100%" stop-color="#12161f"/>
    </linearGradient>
    <linearGradient id="cardFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="55%" stop-color="#000000" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.85"/>
    </linearGradient>

    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#013144" flood-opacity="0.15"/>
    </filter>

    <filter id="badgeShadowGreen" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00cc9c" flood-opacity="0.35"/>
    </filter>

    <clipPath id="phoneClip">
      <rect x="15" y="10" width="400" height="912" rx="46"/>
    </clipPath>

    <clipPath id="card1ImgClip">
      <rect x="0" y="0" width="360" height="144" rx="24"/>
    </clipPath>
    <clipPath id="card2ImgClip">
      <rect x="0" y="0" width="360" height="144" rx="24"/>
    </clipPath>

    <style>
      <![CDATA[
        .live-dot {
          animation: livePulse 1.6s ease-in-out infinite;
        }
        @keyframes livePulse {
          0%, 100% { opacity: 0.5; transform: scale(1); }
          50% { opacity: 1; transform: scale(1.3); }
        }
        .fadeUp {
          animation: fadeInUp 0.7s ease forwards;
          opacity: 0;
        }
        @keyframes fadeInUp {
          from { opacity: 0; transform: translateY(14px); }
          to   { opacity: 1; transform: translateY(0); }
        }
        .nav-dot {
          animation: navPulse 2s ease-in-out infinite;
        }
        @keyframes navPulse {
          0%, 100% { opacity: 0.6; }
          50% { opacity: 1; }
        }
      ]]>
    </style>
  </defs>

  <!-- Outer background -->

  <!-- Phone frame -->
  <rect x="10" y="5" width="410" height="922" rx="50" fill="url(#phoneBorder)" filter="url(#softShadow)"/>

  <!-- Side buttons -->
  <rect x="6" y="145" width="5" height="42" rx="2.5" fill="url(#buttonMetal)"/>
  <rect x="6" y="225" width="5" height="58" rx="2.5" fill="url(#buttonMetal)"/>
  <rect x="6" y="295" width="5" height="58" rx="2.5" fill="url(#buttonMetal)"/>
  <rect x="419" y="230" width="5" height="95" rx="2.5" fill="url(#buttonMetal)"/>

  <!-- Screen inner background (Light inverted mode) -->
  <rect x="15" y="10" width="400" height="912" rx="46" fill="#ffffff"/>
  <rect x="15" y="10" width="400" height="912" rx="46" fill="url(#bgGlow)"/>

  <g clip-path="url(#phoneClip)">

    <!-- Dynamic Island -->
    <rect x="163" y="22" width="104" height="30" rx="15" fill="#000000"/>
    <circle cx="245" cy="37" r="6" fill="url(#cameraLens)"/>
    <circle cx="243" cy="35" r="1.4" fill="#3a4f66" opacity="0.8"/>

    <!-- Status bar -->
    <text x="45" y="55" fill="#013144" font-family="Arial, sans-serif" font-size="14" font-weight="700">9:41</text>
    <g transform="translate(350,42)" fill="none" stroke="#013144" stroke-width="1.6" stroke-linecap="round">
      <path d="M0 6 Q7 -2 14 6"/>
      <path d="M3 9 Q7 5 11 9"/>
      <circle cx="7" cy="12" r="1.2" fill="#013144" stroke="none"/>
    </g>
    <g transform="translate(375,42)">
      <rect x="0" y="2" width="20" height="10" rx="2.5" fill="none" stroke="#013144" stroke-width="1.5"/>
      <rect x="21" y="5.5" width="2" height="3" rx="1" fill="#013144"/>
      <rect x="2" y="4" width="14" height="6" rx="1" fill="#013144"/>
    </g>

    <!-- Header: Smart Search -->
    <rect x="15" y="70" width="400" height="72" fill="url(#headerBlur)"/>
    <rect x="45" y="90" width="340" height="42" rx="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <circle cx="66" cy="111" r="6" fill="none" stroke="#64748b" stroke-width="2"/>
    <line x1="70.5" y1="115.5" x2="75" y2="120" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <text x="86" y="115.5" fill="#64748b" font-family="Arial, sans-serif" font-size="12" font-weight="500">Search Gurugram...</text>
    <g transform="translate(354,101)" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round">
      <line x1="0" y1="3" x2="20" y2="3"/>
      <line x1="0" y1="10" x2="20" y2="10"/>
      <line x1="0" y1="17" x2="20" y2="17"/>
      <circle cx="6" cy="3" r="2.4" fill="#ffffff"/>
      <circle cx="15" cy="10" r="2.4" fill="#ffffff"/>
      <circle cx="8" cy="17" r="2.4" fill="#ffffff"/>
    </g>

    <!-- Smart Filter Row -->
    <g transform="translate(45,152)">
      <rect x="0" y="0" width="102" height="30" rx="15" fill="#00cc9c15" stroke="#00cc9c" stroke-width="1"/>
      <text x="51" y="19.5" text-anchor="middle" fill="#00cc9c" font-family="Arial, sans-serif" font-size="10.5" font-weight="700">Office Space</text>

      <rect x="110" y="0" width="92" height="30" rx="15" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="156" y="19.5" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="10.5" font-weight="700">Warehouse</text>

      <rect x="210" y="0" width="72" height="30" rx="15" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="246" y="19.5" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="10.5" font-weight="700">Retail</text>

      <rect x="290" y="0" width="106" height="30" rx="15" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="343" y="19.5" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="10.5" font-weight="700">Price Range</text>

      <rect x="404" y="0" width="112" height="30" rx="15" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="460" y="19.5" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="10.5" font-weight="700">RERA Verified</text>
    </g>

    <!-- Inventory header row -->
    <text x="45" y="212" fill="#64748b" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">186 SMART MATCHES FOUND</text>
    <circle class="live-dot" cx="374" cy="208" r="3" fill="#00cc9c"/>
    <text x="382" y="212" fill="#00cc9c" font-family="Arial, sans-serif" font-size="10" font-weight="900" letter-spacing="0.5">LIVE FEED</text>

    <!-- Inventory Card 1 -->
    <g transform="translate(35,230)">
     <g class="fadeUp">
      <rect x="0" y="0" width="360" height="222" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <g clip-path="url(#card1ImgClip)">
        <rect x="0" y="0" width="360" height="144" fill="url(#cardImg1)"/>
        <g transform="translate(155,32)" opacity="0.2" fill="none" stroke="#ffffff" stroke-width="3">
          <rect x="0" y="10" width="50" height="70"/>
          <rect x="14" y="20" width="8" height="8"/><rect x="28" y="20" width="8" height="8"/>
          <rect x="14" y="36" width="8" height="8"/><rect x="28" y="36" width="8" height="8"/>
          <rect x="14" y="52" width="8" height="8"/><rect x="28" y="52" width="8" height="8"/>
          <rect x="14" y="68" width="8" height="8"/><rect x="28" y="68" width="8" height="8"/>
        </g>
        <rect x="0" y="0" width="360" height="144" fill="url(#cardFade)"/>
      </g>
      <rect x="284" y="14" width="62" height="24" rx="8" fill="#00cc9c" filter="url(#badgeShadowGreen)"/>
      <text x="315" y="30" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="10" font-weight="900">98% Match</text>

      <rect x="20" y="94" width="46" height="16" rx="4" fill="#f6a200"/>
      <text x="43" y="105.5" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="8" font-weight="900">DIRECT</text>
      <text x="72" y="105.5" fill="#ffffff" font-family="Arial, sans-serif" font-size="10.5" font-weight="700">Golf Course Rd</text>
      <text x="20" y="128" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="700">Horizon Business Tower</text>

      <line x1="0" y1="144" x2="360" y2="144" stroke="#01314415" stroke-width="1"/>

      <rect x="20" y="164" width="120" height="20" rx="4" fill="#01314415"/>
      <text x="20" y="203" fill="#64748b" font-family="Arial, sans-serif" font-size="10.5">48,500 sq.ft · Grade A</text>

      <circle cx="324" cy="183" r="16" fill="#00cc9c1a"/>
      <path d="M330 183 L318 183 M318 183 L323 178 M318 183 L323 188" fill="none" stroke="#00cc9c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
     </g>
    </g>

    <!-- Inventory Card 2 -->
    <g transform="translate(35,470)">
     <g class="fadeUp" style="animation-delay:0.15s">
      <rect x="0" y="0" width="360" height="222" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <g clip-path="url(#card2ImgClip)">
        <rect x="0" y="0" width="360" height="144" fill="url(#cardImg2)"/>
        <g transform="translate(155,32)" opacity="0.2" fill="none" stroke="#ffffff" stroke-width="3">
          <path d="M0 80 L0 30 L25 10 L50 30 L50 80 Z"/>
          <line x1="20" y1="45" x2="30" y2="45"/>
          <line x1="20" y1="60" x2="30" y2="60"/>
        </g>
        <rect x="0" y="0" width="360" height="144" fill="url(#cardFade)"/>
      </g>
      <rect x="284" y="14" width="62" height="24" rx="8" fill="#3b82f6"/>
      <text x="315" y="30" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="10" font-weight="900">85% Match</text>

      <rect x="20" y="94" width="60" height="16" rx="4" fill="#00cc9c"/>
      <text x="50" y="105.5" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="8" font-weight="900">VERIFIED</text>
      <text x="86" y="105.5" fill="#ffffff" font-family="Arial, sans-serif" font-size="10.5" font-weight="700">Cyber City</text>
      <text x="20" y="128" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="700">Nexus IT Park - SEZ</text>

      <line x1="0" y1="144" x2="360" y2="144" stroke="#01314415" stroke-width="1"/>

      <rect x="20" y="164" width="120" height="20" rx="4" fill="#01314415"/>
      <text x="20" y="203" fill="#64748b" font-family="Arial, sans-serif" font-size="10.5">12,200 sq.ft · Managed</text>

      <circle cx="324" cy="183" r="16" fill="#01314415"/>
      <path d="M330 183 L318 183 M318 183 L323 178 M318 183 L323 188" fill="none" stroke="#013144" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
     </g>
    </g>

    <!-- Bottom Nav -->
    <rect x="15" y="832" width="400" height="90" fill="url(#navBlur)"/>
    <line x1="15" y1="832" x2="415" y2="832" stroke="#01314415" stroke-width="1"/>

    <g transform="translate(94,858)" opacity="0.4" fill="none" stroke="#013144" stroke-width="2">
      <path d="M0 12 L12 2 L24 12 L24 24 L15 24 L15 15 L9 15 L9 24 L0 24 Z" stroke-linejoin="round"/>
    </g>

    <g transform="translate(174,858)" fill="none" stroke="#f6a200" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="10" cy="10" r="8"/>
      <line x1="16" y1="16" x2="23" y2="23"/>
      <circle class="nav-dot" cx="10" cy="33" r="2" fill="#f6a200" stroke="none"/>
    </g>

    <g transform="translate(254,858)" opacity="0.4" fill="none" stroke="#013144" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="8" r="5"/>
      <path d="M2 26 C2 18 6 15 12 15 C18 15 22 18 22 26"/>
    </g>

    <g transform="translate(334,858)" opacity="0.4" fill="none" stroke="#013144" stroke-width="1.8" stroke-linejoin="round">
      <path d="M9 0 L17 3 L17 9 C17 14 13.5 17.5 9 19 C4.5 17.5 1 14 1 9 L1 3 Z"/>
    </g>

    <!-- Glass sheen overlay -->
    <rect x="15" y="10" width="400" height="912" rx="46" fill="url(#glassSheen)"/>

  </g>

  <!-- Outer frame highlight -->
  <rect x="15" y="10" width="400" height="912" rx="46" fill="none" stroke="#0131441a" stroke-width="1.2"/>
  <rect x="10" y="5" width="410" height="922" rx="50" fill="none" stroke="#0131440f" stroke-width="0.8"/>
</svg>
