<svg width="430" height="700" viewBox="0 0 430 932" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#00cc9c" stop-opacity="0.08"/>
      <stop offset="70%" stop-color="#00cc9c" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="phoneBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a9a9e"/>
      <stop offset="18%" stop-color="#e4e4e7"/>
      <stop offset="35%" stop-color="#6f6f74"/>
      <stop offset="55%" stop-color="#8f8f94"/>
      <stop offset="75%" stop-color="#4a4a4e"/>
      <stop offset="100%" stop-color="#232326"/>
    </linearGradient>

    <linearGradient id="buttonMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#57575b"/>
      <stop offset="50%" stop-color="#c9c9cd"/>
      <stop offset="100%" stop-color="#3a3a3d"/>
    </linearGradient>

    <linearGradient id="glassSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="18%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="cameraLens" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#5a7ea8"/>
      <stop offset="45%" stop-color="#12181f"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <linearGradient id="conicSpin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00cc9c"/>
      <stop offset="50%" stop-color="#f6a200"/>
      <stop offset="100%" stop-color="#00cc9c"/>
    </linearGradient>

    <linearGradient id="navBlur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.98"/>
    </linearGradient>

    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#013144" flood-opacity="0.15"/>
    </filter>

    <filter id="badgeShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#00cc9c" flood-opacity="0.4"/>
    </filter>

    <clipPath id="phoneClip">
      <rect x="15" y="10" width="400" height="912" rx="46"/>
    </clipPath>

    <style>
      <![CDATA[
        .slideDown {
          animation: slideDown 0.8s cubic-bezier(0.18,0.89,0.32,1.28) forwards;
        }
        @keyframes slideDown {
          from { opacity: 0; transform: translateY(-12px); }
          to   { opacity: 1; transform: translateY(0); }
        }
        .toast-dot {
          animation: toastPulse 2s ease-in-out infinite;
        }
        @keyframes toastPulse {
          0%, 100% { opacity: 0.5; }
          50% { opacity: 1; }
        }
        .spin-ring {
          animation: spin 3s linear infinite;
          transform-origin: 55px 205px;
        }
        @keyframes spin {
          from { transform: rotate(0deg); }
          to   { transform: rotate(360deg); }
        }
        .nav-dot {
          animation: navPulse 2s ease-in-out infinite;
        }
        @keyframes navPulse {
          0%, 100% { opacity: 0.6; }
          50% { opacity: 1; }
        }
      ]]>
    </style>
  </defs>

  <!-- Outer background -->

  <!-- Phone frame -->
  <rect x="10" y="5" width="410" height="922" rx="50" fill="url(#phoneBorder)" filter="url(#softShadow)"/>

  <!-- Side buttons -->
  <rect x="6" y="145" width="5" height="42" rx="2.5" fill="url(#buttonMetal)"/>
  <rect x="6" y="225" width="5" height="58" rx="2.5" fill="url(#buttonMetal)"/>
  <rect x="6" y="295" width="5" height="58" rx="2.5" fill="url(#buttonMetal)"/>
  <rect x="419" y="230" width="5" height="95" rx="2.5" fill="url(#buttonMetal)"/>

  <!-- Screen inner background (Light inverted mode) -->
  <rect x="15" y="10" width="400" height="912" rx="46" fill="#ffffff"/>
  <rect x="15" y="10" width="400" height="912" rx="46" fill="url(#bgGlow)"/>

  <g clip-path="url(#phoneClip)">

    <!-- Dynamic Island -->
    <rect x="163" y="22" width="104" height="30" rx="15" fill="#000000"/>
    <circle cx="245" cy="37" r="6" fill="url(#cameraLens)"/>
    <circle cx="243" cy="35" r="1.4" fill="#3a4f66" opacity="0.8"/>

    <!-- Status bar -->
    <text x="45" y="58" fill="#013144" font-family="Arial, sans-serif" font-size="14" font-weight="700">9:41</text>
    <g transform="translate(350,45)" fill="none" stroke="#013144" stroke-width="1.6" stroke-linecap="round">
      <path d="M0 6 Q7 -2 14 6"/>
      <path d="M3 9 Q7 5 11 9"/>
      <circle cx="7" cy="12" r="1.2" fill="#013144" stroke="none"/>
    </g>
    <g transform="translate(375,45)">
      <rect x="0" y="2" width="20" height="10" rx="2.5" fill="none" stroke="#013144" stroke-width="1.5"/>
      <rect x="21" y="5.5" width="2" height="3" rx="1" fill="#013144"/>
      <rect x="2" y="4" width="14" height="6" rx="1" fill="#013144"/>
    </g>

    <!-- Header -->
    <path d="M50 80 L39 90 L50 100" fill="none" stroke="#013144" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="215" y="96" text-anchor="middle" fill="#013144" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="-0.3">Broker Identity</text>
    <g transform="translate(370,80)" fill="#013144" opacity="0.7">
      <circle cx="10" cy="10" r="2"/>
      <circle cx="10" cy="18" r="2"/>
      <circle cx="10" cy="26" r="2"/>
    </g>

    <!-- Success Toast -->
    <g class="slideDown">
      <rect x="35" y="120" width="360" height="56" rx="18" fill="#00cc9c15" stroke="#00cc9c4d" stroke-width="1"/>
      <circle cx="63" cy="148" r="16" fill="#00cc9c33"/>
      <path d="M56 148 L61 153 L71 141" fill="none" stroke="#00cc9c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="90" y="144" fill="#013144" font-family="Arial, sans-serif" font-size="12" font-weight="700">Verification Successful</text>
      <text x="90" y="160" fill="#64748b" font-family="Arial, sans-serif" font-size="10.5">Identity &amp; RERA Mandates active</text>
      <circle class="toast-dot" cx="378" cy="148" r="3" fill="#00cc9c"/>
    </g>

    <!-- Profile Card -->
    <rect x="35" y="192" width="360" height="150" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>

    <circle cx="95" cy="267" r="41" fill="none" stroke="url(#conicSpin)" stroke-width="3.5"/>
    <circle cx="95" cy="267" r="36" fill="#013144" stroke="#ffffff" stroke-width="2"/>
    <g transform="translate(80,252)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="15" cy="10" r="7"/>
      <path d="M2 30 C2 20 8 16 15 16 C22 16 28 20 28 30"/>
    </g>
    <circle cx="122" cy="292" r="13" fill="#00cc9c" stroke="#ffffff" stroke-width="2" filter="url(#badgeShadow)"/>
    <path d="M116 292 L120 296 L128 287" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="160" y="228" width="96" height="16" rx="4" fill="#01314415"/>
    <rect x="160" y="252" width="150" height="24" rx="8" fill="#00cc9c15" stroke="#00cc9c4d" stroke-width="1"/>
    <path d="M170 264 L173 267 L179 260" fill="none" stroke="#00cc9c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="185" y="268" fill="#00cc9c" font-family="Arial, sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.5">VERIFIED PARTNER</text>

    <text x="160" y="298" fill="#013144" font-family="Arial, sans-serif" font-size="12" font-weight="600">Principal Consultant</text>
    <text x="160" y="317" fill="#64748b" font-family="Arial, sans-serif" font-size="10.5">Reg ID: BRK-7742-XP</text>

    <!-- Secondary Info -->
    <rect x="35" y="364" width="360" height="76" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="51" y="380" width="44" height="44" rx="12" fill="#f6a2001a"/>
    <g transform="translate(63,392)" fill="none" stroke="#d97706" stroke-width="1.8" stroke-linejoin="round">
      <path d="M9 0 L17 3 L17 9 C17 14 13.5 17.5 9 19 C4.5 17.5 1 14 1 9 L1 3 Z"/>
      <path d="M5.5 9.5 L8 12 L13 6.5" stroke-linecap="round"/>
    </g>
    <text x="111" y="394" fill="#64748b" font-family="Arial, sans-serif" font-size="9.5" font-weight="700" letter-spacing="1">DOCUMENT STATUS</text>
    <text x="111" y="412" fill="#013144" font-family="Arial, sans-serif" font-size="12" font-weight="600">RERA Credentials Active</text>
    <path d="M375 398 L381 402 L375 406" fill="none" stroke="#01314440" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="35" y="452" width="360" height="76" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="51" y="468" width="44" height="44" rx="12" fill="#00cc9c1a"/>
    <g transform="translate(63,480)" fill="none" stroke="#00cc9c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="7" cy="6" r="4"/>
      <path d="M0 19 C0 13 3 10 7 10 C11 10 14 13 14 19"/>
      <circle cx="17" cy="7" r="3.2"/>
      <path d="M13 19 C13 14.5 15 12.5 17 12.5 C18.6 12.5 20 13.6 20.5 15.5"/>
    </g>
    <text x="111" y="482" fill="#64748b" font-family="Arial, sans-serif" font-size="9.5" font-weight="700" letter-spacing="1">NETWORK REACH</text>
    <text x="111" y="500" fill="#013144" font-family="Arial, sans-serif" font-size="12" font-weight="600">1,240 Verified Connections</text>

    <!-- Bottom Nav -->
    <rect x="15" y="832" width="400" height="90" fill="url(#navBlur)"/>
    <line x1="15" y1="832" x2="415" y2="832" stroke="#01314415" stroke-width="1"/>

    <g transform="translate(94,858)" opacity="0.4" fill="none" stroke="#013144" stroke-width="2">
      <path d="M0 12 L12 2 L24 12 L24 24 L15 24 L15 15 L9 15 L9 24 L0 24 Z" stroke-linejoin="round"/>
    </g>

    <g transform="translate(174,858)" opacity="0.4" fill="none" stroke="#013144" stroke-width="2">
      <circle cx="10" cy="10" r="8"/>
      <line x1="16" y1="16" x2="23" y2="23" stroke-linecap="round"/>
    </g>

    <g transform="translate(254,858)" fill="none" stroke="#f6a200" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="8" r="5"/>
      <path d="M2 26 C2 18 6 15 12 15 C18 15 22 18 22 26"/>
      <circle class="nav-dot" cx="12" cy="33" r="2" fill="#f6a200" stroke="none"/>
    </g>

    <g transform="translate(334,858)" opacity="0.4" fill="none" stroke="#013144" stroke-width="2">
      <circle cx="12" cy="12" r="3.4"/>
      <path d="M12 1 L12 5 M12 19 L12 23 M1 12 L5 12 M19 12 L23 12 M4.5 4.5 L7.2 7.2 M16.8 16.8 L19.5 19.5 M19.5 4.5 L16.8 7.2 M7.2 16.8 L4.5 19.5" stroke-linecap="round"/>
    </g>

    <!-- Glass sheen overlay -->
    <rect x="15" y="10" width="400" height="912" rx="46" fill="url(#glassSheen)"/>

  </g>

  <!-- Outer frame highlight -->
  <rect x="15" y="10" width="400" height="912" rx="46" fill="none" stroke="#0131441a" stroke-width="1.2"/>
  <rect x="10" y="5" width="410" height="922" rx="50" fill="none" stroke="#0131440f" stroke-width="0.8"/>
</svg>