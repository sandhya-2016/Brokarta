        <text x="0" y="80" fill="#013144" font-family="Arial, sans-serif" font-size="24" font-weight="900" letter-spacing="-0.5">Rahul Sharma</text>
        <text x="0" y="102" fill="#d97706" font-family="Arial, sans-serif" font-size="11" font-weight="900" letter-spacing="2">SENIOR COMMERCIAL SPECIALIST</text>
