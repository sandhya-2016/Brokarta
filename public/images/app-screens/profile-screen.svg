<svg width="430" height="700" viewBox="0 0 430 932" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#00cc9c" stop-opacity="0.08"/>
      <stop offset="70%" stop-color="#00cc9c" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="phoneBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a9a9e"/>
      <stop offset="18%" stop-color="#e4e4e7"/>
      <stop offset="35%" stop-color="#6f6f74"/>
      <stop offset="55%" stop-color="#8f8f94"/>
      <stop offset="75%" stop-color="#4a4a4e"/>
      <stop offset="100%" stop-color="#232326"/>
    </linearGradient>

    <linearGradient id="buttonMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#57575b"/>
      <stop offset="50%" stop-color="#c9c9cd"/>
      <stop offset="100%" stop-color="#3a3a3d"/>
    </linearGradient>

    <linearGradient id="glassSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="18%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="cameraLens" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#5a7ea8"/>
      <stop offset="45%" stop-color="#12181f"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <linearGradient id="conicRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00cc9c"/>
      <stop offset="70%" stop-color="#00cc9c"/>
      <stop offset="85%" stop-color="#f6a200"/>
      <stop offset="100%" stop-color="#00cc9c"/>
    </linearGradient>

    <linearGradient id="skySunsetA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3f6b"/>
      <stop offset="55%" stop-color="#8a5a7a"/>
      <stop offset="100%" stop-color="#e8a35c"/>
    </linearGradient>
    <linearGradient id="skyDuskB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c2b45"/>
      <stop offset="55%" stop-color="#33507a"/>
      <stop offset="100%" stop-color="#6f93b8"/>
    </linearGradient>
    <linearGradient id="towerGlassA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0e1520"/>
      <stop offset="50%" stop-color="#233246"/>
      <stop offset="100%" stop-color="#0e1520"/>
    </linearGradient>
    <linearGradient id="towerGlassB" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#101a26"/>
      <stop offset="50%" stop-color="#26374c"/>
      <stop offset="100%" stop-color="#101a26"/>
    </linearGradient>

    <linearGradient id="navBlur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.98"/>
    </linearGradient>

    <linearGradient id="headerBlur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.85"/>
    </linearGradient>

    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#013144" flood-opacity="0.15"/>
    </filter>

    <filter id="avatarShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#013144" flood-opacity="0.25"/>
    </filter>

    <clipPath id="phoneClip">
      <rect x="15" y="10" width="400" height="912" rx="46"/>
    </clipPath>

    <clipPath id="card1Clip">
      <rect x="0" y="0" width="160" height="96" rx="18"/>
    </clipPath>
    <clipPath id="card2Clip">
      <rect x="0" y="0" width="160" height="96" rx="18"/>
    </clipPath>

    <style>
      <![CDATA[
        .fadeUp {
          animation: fadeInUp 0.8s ease forwards;
          opacity: 0;
        }
        @keyframes fadeInUp {
          from { opacity: 0; transform: translateY(16px); }
          to   { opacity: 1; transform: translateY(0); }
        }
        .dot-pulse {
          animation: dotPulse 2s ease-in-out infinite;
        }
        @keyframes dotPulse {
          0%, 100% { opacity: 0.6; }
          50% { opacity: 1; }
        }
      ]]>
    </style>
